name: Deploy to GitHub Pages

on:
  # Run on every push to release (the default / deployed branch).
  push:
    branches: [release]
  # Or whenever you trigger it manually from the Actions tab.
  workflow_dispatch:
  # Daily, so the social card's "live outstanding" tracks the loan's daily
  # rollover. 19:30 UTC = 01:00 IST (safely after midnight, allowing for the
  # usual GitHub cron delay). Change the time/zone to match your own.
  schedule:
    - cron: '30 19 * * *'

# Pages deployment requires these specific permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run two deploys at once; cancel the old one if a new push comes in.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recompute today's outstanding and re-render public/og.png so the social
      # card stays current. Uses the runner's pre-installed Chrome. TZ sets the
      # day boundary (the loan's home zone); change it to match your own.
      - name: Generate social card
        env:
          TZ: Asia/Kolkata
        run: |
          export CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium-browser || true)"
          echo "Chrome: ${CHROME_PATH:-not found, falling back to default paths}"
          npm run og

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
